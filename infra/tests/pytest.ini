[pytest]
# Run test files in filename order (00 → 11) so domain data is seeded
# before aggregate endpoints are called (e.g. health-summary needs food+workout logs).
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:randomly
    --timeout=30

timeout = 30

testpaths = api

markers =
    smoke: fast sanity checks — health endpoints and auth basics
    crud: create and read operations for each data domain
    aggregate: endpoints that depend on data seeded by earlier tests
    ai: endpoints that call the AI service (may use graceful fallback)
    auth_boundary: 401/403 enforcement across all protected routes
