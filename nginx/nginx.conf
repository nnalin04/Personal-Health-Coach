events {
    worker_connections 1024;
}

http {
    upstream backend {
        server springboot-app:8080;
    }

    # HTTP server — serves traffic and handles Let's Encrypt challenges
    server {
        listen 80;
        server_name _;  # Replace with your domain when available

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS (uncomment after SSL cert is obtained)
        # return 301 https://$host$request_uri;

        # Proxy to backend (remove this block after enabling HTTPS redirect above)
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS server — uncomment entirely after obtaining SSL certificate
    # server {
    #     listen 443 ssl;
    #     server_name YOUR_DOMAIN_HERE;
    #
    #     ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
