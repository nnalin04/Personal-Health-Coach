events {
    worker_connections 1024;
}

http {
    upstream backend {
        server springboot-app:8080;
    }

    # HTTP server — handles ACME challenges, redirects all else to HTTPS
    server {
        listen 80;
        server_name healthcoach.duckdns.org;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name healthcoach.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/healthcoach.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/healthcoach.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
