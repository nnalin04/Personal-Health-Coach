services:
  postgres:
    image: postgres:16-alpine
    container_name: health-coach-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - health-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: health-coach-ai
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    networks:
      - health-network
    # Not exposing ports to host - backend communicates via internal network

  springboot-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-coach-backend
    restart: always
    # Port 8080 is NOT exposed to the host; nginx handles all ingress
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - AI_BASE_URL=http://fastapi-ai:8000
      - UPLOAD_DIR=/app/uploads
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - app_uploads:/app/uploads
    networks:
      - health-network
    depends_on:
      postgres:
        condition: service_healthy
      fastapi-ai:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: health-coach-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - health-network
    depends_on:
      - springboot-app

  certbot:
    image: certbot/certbot
    container_name: health-coach-certbot
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      certonly --webroot
      -w /var/www/certbot
      --email admin@healthcoach.app
      --agree-tos
      --no-eff-email
      -d YOUR_DOMAIN_HERE

volumes:
  postgres_data:
  app_uploads:
  letsencrypt:
  certbot_www:

networks:
  health-network:
    driver: bridge
