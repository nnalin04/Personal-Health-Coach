<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0A0A0A",
                        "card-dark": "#141414",
                        "border-dark": "#1F2937",
                        "muted-text": "#9CA3AF"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .health-logo-gradient {
            background: linear-gradient(135deg, #2463eb 0%, #1d4ed8 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md space-y-8">
<!-- Logo and Header -->
<div class="flex flex-col items-center space-y-6">
<div class="size-[72px] health-logo-gradient rounded-full flex items-center justify-center shadow-lg shadow-primary/20">
<span class="text-white text-4xl font-bold">H</span>
</div>
<div class="text-center space-y-2">
<h1 class="text-3xl font-bold tracking-tight">Health OS</h1>
<p class="text-muted-text text-base">Your personal AI health coach</p>
</div>
</div>
<!-- Auth Card -->
<div class="space-y-6">
<!-- Tab Switcher -->
<div class="flex p-1 bg-card-dark rounded-xl border border-border-dark">
<button class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all bg-primary text-white shadow-sm">
                    Log In
                </button>
<button class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all text-muted-text hover:text-slate-100">
                    Create Account
                </button>
</div>
<!-- Form -->
<form class="space-y-4" onsubmit="return false;">
<div class="space-y-1.5">
<label class="text-sm font-medium text-muted-text px-1">Email</label>
<input class="w-full h-14 bg-card-dark border-border-dark rounded-xl px-4 text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-muted-text/50" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-sm font-medium text-muted-text">Password</label>
<a class="text-xs text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full h-14 bg-card-dark border-border-dark rounded-xl px-4 text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-muted-text/50" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-muted-text hover:text-slate-100" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-semibold rounded-xl shadow-lg shadow-primary/10 transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-dark"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-background-dark px-4 text-muted-text font-medium tracking-widest">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<button class="w-full h-14 bg-card-dark border border-border-dark hover:border-primary/50 text-slate-100 font-medium rounded-xl transition-all flex items-center justify-center gap-3">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
</div>
<!-- Footer -->
<p class="text-center text-sm text-muted-text">
            By continuing, you agree to our 
            <a class="text-slate-300 hover:text-primary transition-colors underline decoration-border-dark underline-offset-4" href="#">Terms of Service</a>
</p>
</div>
</body></html>
