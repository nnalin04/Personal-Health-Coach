server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/health_coach}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: HealthCoachPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    # Per-cache specs managed by CacheConfig bean (CaffeineCacheManager).
    # refreshAfterWrite prevents cache stampede: stale value returned to concurrent
    # callers while one thread asynchronously reloads. See CacheConfig.java.
    type: caffeine
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}           # access token: 1 hour (3 600 000 ms)
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}    # refresh token: 7 days (604 800 000 ms)
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    # Comma-separated list; override via CORS_ALLOWED_ORIGINS env var in prod
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8080}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
