name: CD — Build, Push & Deploy

# Triggers on version tags: v1.0.0, v1.2.3, etc.
# Create a release: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*.*.*'

env:
  GCP_PROJECT: my-project-poc-478915
  REGISTRY: gcr.io
  IMAGE_BACKEND: gcr.io/my-project-poc-478915/health-coach-backend
  IMAGE_AI: gcr.io/my-project-poc-478915/health-coach-ai
  VM_HOST: 34.45.115.228
  VM_USER: ubuntu

# ── Required GitHub Secrets ─────────────────────────────────────────────────
# GCP_SA_KEY      — GCP service account JSON with roles/artifactregistry.writer
# VM_SSH_KEY      — Private SSH key for ubuntu@34.45.115.228
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Build Docker images and push to GCR ──────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images to GCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push backend image
        run: |
          docker build -t $IMAGE_BACKEND:${{ steps.meta.outputs.tag }} \
                       -t $IMAGE_BACKEND:latest \
                       ./services/orchestrator
          docker push $IMAGE_BACKEND:${{ steps.meta.outputs.tag }}
          docker push $IMAGE_BACKEND:latest

      - name: Build and push AI service image
        run: |
          docker build -t $IMAGE_AI:${{ steps.meta.outputs.tag }} \
                       -t $IMAGE_AI:latest \
                       ./services/ai-engine
          docker push $IMAGE_AI:${{ steps.meta.outputs.tag }}
          docker push $IMAGE_AI:latest

  # ── 2. Deploy to GCP VM ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/health-coach

            # Authenticate Docker to GCR on VM
            gcloud auth configure-docker gcr.io --quiet

            # Pull latest images
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_AI }}:latest

            # Restart services with new images (Spring Boot takes ~4.5min on e2-micro)
            docker compose -f docker-compose.prod.yml up -d --no-build

            # Verify health — wait up to 5 min (60 x 5s) for backend to start
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 60); do
              STATUS=$(curl -sf http://localhost:8080/actuator/health \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
              if [[ "$STATUS" == "UP" ]]; then
                echo "Backend healthy after ${i}x5s wait."
                exit 0
              fi
              sleep 5
            done
            echo "Backend did not become healthy in 5 minutes — check logs!"
            docker compose -f docker-compose.prod.yml logs --tail=50 springboot-app
            exit 1

  # ── 3. Build Android APK via Expo EAS and publish GitHub Release ─────────────
  release-apk:
    name: Build Android APK (Expo EAS) & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK via EAS (non-interactive)
        working-directory: apps/mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --output ./build/app-release.apk

      - name: Generate release notes from git log
        id: notes
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD --no-merges)
          else
            NOTES=$(git log --oneline -20 --no-merges)
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## What's Changed
            ${{ steps.notes.outputs.notes }}

            ## Install
            Download `app-release.apk` below and install on Android (enable "Install from unknown sources").
          files: apps/mobile-app/build/app-release.apk
          draft: false
          prerelease: false
