<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0A0A0A",
                        "surface-dark": "#1C1C1E",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2d2d2d;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark border-b border-slate-200 dark:border-slate-800 p-4 shrink-0">
<div class="flex items-center gap-2 flex-1">
<button class="text-slate-600 dark:text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Dashboard</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight text-center">Health OS</h2>
<div class="flex flex-1 justify-end items-center">
<div class="h-2.5 w-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
</div>
</header>
<!-- Chat Container -->
<main class="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar">
<!-- AI Message -->
<div class="flex items-start gap-3">
<div class="bg-primary/10 rounded-full p-2 flex shrink-0">
<span class="material-symbols-outlined text-primary text-xl">smart_toy</span>
</div>
<div class="flex flex-col gap-1 items-start max-w-[80%]">
<p class="text-slate-500 dark:text-slate-400 text-[12px] font-medium ml-1 uppercase tracking-wider">Health AI</p>
<div class="bg-slate-200 dark:bg-surface-dark rounded-2xl rounded-tl-none px-4 py-3 text-slate-900 dark:text-slate-100 shadow-sm">
<p class="text-[15px] leading-relaxed">Hi Nishit! What did you eat today?</p>
</div>
</div>
</div>
<!-- Suggestion Chips -->
<div class="flex gap-2 pl-12 flex-wrap">
<button class="flex h-9 items-center justify-center gap-2 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-surface-dark px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
<span class="material-symbols-outlined text-sm text-primary">restaurant</span>
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium">Log breakfast</p>
</button>
<button class="flex h-9 items-center justify-center gap-2 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-surface-dark px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-sm text-primary">lunch_dining</span>
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium">Log lunch</p>
</button>
<button class="flex h-9 items-center justify-center gap-2 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-surface-dark px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-sm text-primary">upload_file</span>
<p class="text-slate-700 dark:text-slate-300 text-sm font-medium">Upload report</p>
</button>
</div>
<!-- User Message -->
<div class="flex items-start gap-3 justify-end">
<div class="flex flex-col gap-1 items-end max-w-[80%]">
<p class="text-slate-500 dark:text-slate-400 text-[12px] font-medium mr-1 uppercase tracking-wider">Nishit</p>
<div class="bg-primary rounded-2xl rounded-tr-none px-4 py-3 text-white shadow-lg shadow-primary/10">
<p class="text-[15px] leading-relaxed">I had poha for breakfast</p>
</div>
</div>
<div class="h-10 w-10 shrink-0 overflow-hidden rounded-full border-2 border-primary/20 bg-cover bg-center" data-alt="Nishit's profile avatar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDW_TBOUKRFKok1kaZaM6D3y63GmPK6zg6u8_8-YM0W0paY0N7bjI0A3XuCZZ21RcxRlAZwg2p8nP4NrZ60I3K0QHAaE1ivtZGU2Ox2B7ucbYqInc1Uuk0FuVeY6AYlZNp3_6ebDvE3gQQ2NfzvISsndic4gmvbQS324ersJq4LvM4SistES-WzWbyPYvaKsc_YVkEKqaViXKgwce0KPcJT52x-eYgNzhKCBl1oXPmEeJagBGGv5QjSbY1V9KLWlF6XdN2hNcJYrd27')"></div>
</div>
<!-- AI Message (Analyzing) -->
<div class="flex items-start gap-3">
<div class="bg-primary/10 rounded-full p-2 flex shrink-0">
<span class="material-symbols-outlined text-primary text-xl">smart_toy</span>
</div>
<div class="flex flex-col gap-1 items-start">
<p class="text-slate-500 dark:text-slate-400 text-[12px] font-medium ml-1 uppercase tracking-wider">Health AI</p>
<div class="bg-slate-200 dark:bg-surface-dark rounded-2xl rounded-tl-none px-4 py-3 text-slate-900 dark:text-slate-100 shadow-sm min-w-[120px]">
<p class="text-[15px] italic text-slate-500 dark:text-slate-400">Analysing...</p>
</div>
</div>
</div>
</main>
<!-- Input Bar -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800">
<div class="mx-auto max-w-4xl flex items-center gap-3">
<button class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-200 dark:bg-surface-dark text-slate-600 dark:text-slate-400 hover:text-primary transition-colors shrink-0">
<span class="material-symbols-outlined">attach_file</span>
</button>
<div class="relative flex-1">
<input class="w-full h-12 bg-slate-200 dark:bg-surface-dark border-none rounded-xl px-4 text-slate-900 dark:text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-primary/50 transition-all text-sm" placeholder="Message..." type="text"/>
</div>
<button class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary text-white shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all shrink-0">
<span class="material-symbols-outlined">send</span>
</button>
</div>
<!-- Extra padding for mobile safe areas if needed -->
<div class="h-2"></div>
</footer>
</div>
</body></html>
