name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend unit tests (JUnit5 + H2 in-memory, no Docker needed) ────────
  backend-test:
    name: Backend Tests (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend unit tests
        working-directory: services/orchestrator
        run: mvn test -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: services/orchestrator/target/surefire-reports/

  # ── 2. AI service tests (pytest + TestClient, no Docker needed) ─────────────
  ai-test:
    name: AI Service Tests (Python 3.11 / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-engine/requirements.txt

      - name: Install AI service dependencies
        working-directory: services/ai-engine
        run: pip install -r requirements.txt

      - name: Run AI service tests
        working-directory: services/ai-engine
        env:
          GEMINI_API_KEY: dummy-key-for-unit-tests
          GEMINI_MODEL: gemini-2.5-flash
        run: python -m pytest tests/ -v --tb=short

  # ── 3. Mobile unit tests (React Native / Jest) ──────────────────────────────
  mobile-test:
    name: Mobile Tests (React Native / Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Run Jest tests
        working-directory: apps/mobile-app
        run: npx jest --passWithNoTests --ci

  # ── 4. TypeScript type-check ────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: TypeScript type-check
        working-directory: apps/mobile-app
        run: npx tsc --noEmit

  # ── Note on E2E tests ────────────────────────────────────────────────────────
  # E2E API tests (infra/tests/api/) require live Docker services and are NOT
  # run in CI. Run them locally with: bash infra/scripts/run_dev_tests.sh
  # Or against production: python3 e2e_prod_test.py
