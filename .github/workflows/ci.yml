name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend unit tests (JUnit5 + H2 in-memory, no Docker needed) ────────
  backend-test:
    name: Backend Tests (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend unit tests
        working-directory: backend
        run: mvn test -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  # ── 2. AI service tests (pytest + TestClient, no Docker needed) ─────────────
  ai-test:
    name: AI Service Tests (Python 3.11 / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run AI service tests
        working-directory: ai-service
        env:
          GEMINI_API_KEY: dummy-key-for-unit-tests
          GEMINI_MODEL: gemini-2.5-flash
        run: python -m pytest tests/ -v --tb=short

  # ── 3. Flutter unit tests ───────────────────────────────────────────────────
  flutter-test:
    name: Flutter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

  # ── 4. iOS compile check (catches Dart/Swift compile errors early) ──────────
  ios-compile:
    name: iOS Compile Check (flutter build ios --no-codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify iOS builds (no codesign)
        working-directory: mobile
        run: flutter build ios --no-codesign --release

  # ── Note on E2E tests ────────────────────────────────────────────────────────
  # E2E API tests (tests/api/) require live Docker services and are NOT run
  # in CI. Run them locally with: bash scripts/run_dev_tests.sh
  # Or against production: python3 e2e_prod_test.py
