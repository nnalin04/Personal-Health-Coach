events {
    worker_connections 1024;
}

http {
    # ── Security: Service isolation ─────────────────────────────────────────
    # nginx is the ONLY public ingress. It proxies exclusively to the
    # Spring Boot backend (springboot-app:8080) on the internal docker network.
    #
    # The FastAPI AI service (fastapi-ai:8000) is NEVER proxied externally:
    #   - docker-compose.prod.yml: no ports: mapping for fastapi-ai
    #   - GCP firewall: port 8000 is NOT open (only 22, 80, 443)
    #   - The backend calls AI service internally as http://fastapi-ai:8000
    #
    # If a request for an AI-service path somehow reaches nginx, it is handled
    # by Spring Boot which will return 404 — AI service is never a direct target.
    # ────────────────────────────────────────────────────────────────────────

    upstream backend {
        server springboot-app:8080;
    }

    # HTTP server — handles ACME challenges, redirects all else to HTTPS
    server {
        listen 80;
        server_name healthcoach.duckdns.org;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name healthcoach.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/healthcoach.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/healthcoach.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── WebSocket (STOMP) — real-time task notifications ────────────────
        # React Native connects to wss://healthcoach.duckdns.org/ws
        # SockJS fallback also served from the same path.
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;   # keep WS alive for up to 1 hour
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
